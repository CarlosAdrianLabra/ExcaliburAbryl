{% load widget_tweaks %}

<form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="modal-header bg-gray-dark color-palette">
        <h3 class="modal-title">DATOS DEL CALZADO</h3>
        <button type="button" class="close" data-dismiss="modal"><i class="fas fa-times" style="color: white;"></i></button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label>Código de barras:</label>{{ form.barcode }}
            <label>Nombre:</label>{{ form.nombre }}
            <label>Marca:</label>{{ form.marca }}
            <label>Proveedor:</label>{{ form.proveedor }}
            <label>Medida:</label>{{ form.medida }}
            <label>Existencias:</label>{{ form.stock }}
            <label>Precio de compra:</label>{{ form.precio_compra }}
            <label>Precio de venta:</label>{{ form.precio_venta }}
            <label class="col-12" style="margin-left: -7px;">Imagen:</label>{{ form.img }}
            <span style="display: none;">{{ form.tipo }}</span>
            <span style="display: none;">{{ form.almacen }}</span>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        <button type="submit" class="btn btn-primary">Crear</button>
    </div>
</form>
