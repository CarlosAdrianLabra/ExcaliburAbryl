{% load widget_tweaks %}

<div class="modal-header bg-gray-dark color-palette">
    <h3 class="modal-title">{{ productos.nombre }}</h3>
    <button type="button" class="close" data-dismiss="modal"><i class="fas fa-times" style="color: white;"></i></button>
</div>

<div class="modal-body">
    <table class="table">
        <thead>
            <tr>
                <th class="text-center" scope="col">Código de barras</th>
                <th class="text-center" scope="col">Nombre</th>
                <th class="text-center" scope="col">Marca</th>
                <th class="text-center" scope="col">Existencias</th>
                <th class="text-center" scope="col">Precio</th>
                <th class="text-center" scope="col">Imagen</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="text-center">{{ productos.barcode }}</td>
                <td class="text-center">{{ productos.nombre }}</td>
                <td class="text-center">{{ productos.marca }}</td>
                <td class="text-center">{{ productos.stock }}</td>
                <td class="text-center">{{ productos.precio_venta }}</td>
                <td class="text-center"><img src="http://127.0.0.1:8000/media/{{ productos.img }}" width="250" height="225"></td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
</div>
