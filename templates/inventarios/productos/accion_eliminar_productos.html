{% load widget_tweaks %}

<form method="post" style="margin-bottom: -2px;">{% csrf_token %}
    <div class="modal-header bg-gray-dark color-palette">
        <h3 class="modal-title">ELIMINAR - {{productos.nombreP}}</h3>
        <button type="button" class="close" data-dismiss="modal"><i class="fas fa-times" style="color: white;"></i></button>
    </div>

    <div class="modal-body">
        <p>¿Estás seguro que deseas eliminar <strong>{{ productos.nombreP }} - {{productos.marcaP}} - {{productos.modeloP}}</strong> ?</p>
    </div>
    
    <div class="modal-footer card-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        <button type="submit" id="delete-btn" class="btn btn-danger">Eliminar</button>
    </div>
</form>
