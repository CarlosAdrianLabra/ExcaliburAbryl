{% load widget_tweaks %}

<form method="post" enctype="multipart/form-data" style="margin-bottom: -2px;">{% csrf_token %}
    <div class="modal-header bg-gray-dark color-palette">
        <h3 class="modal-title">ACTUALIZAR - {{productos.nombreP}}</h3>
        <button type="button" class="close" data-dismiss="modal"><i class="fas fa-times" style="color: white;"></i></button>
    </div>

    <div class="modal-body">
        <div class="{% if form.non_field_errors %}invalid{% endif %} mb-2">
        {% for error in form.non_field_errors %}
            {{ error }}
        {% endfor %}
        </div>

        <div class="form-group">
            <label>Nombre:</label>{{form.nombreP}}
            <label>Marca:</label>{{form.marcaP}}
            <label>Modelo:</label>{{form.modeloP}}
            <label>Stock:</label>{{form.cantidadP}}
            <label>Precio:</label>{{form.precioP}}
            <label class="col-12" style="margin-left: -7px;">Imagen:</label>{{form.imagenP}}
        </div>
    </div>

    <div class="modal-footer card-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </div>
</form>
