{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registrar cuenta</title>
        <!-- Favicon Abryl -->
        <link rel="shortcut icon" type="image/png" href="{% static 'img/pagina_inicio/favicon.ico' %}"/>
        <!-- Google Font: Source Sans Pro -->
        <link rel="stylesheet" href="{% static 'css/google-font.css' %}">
        <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
        <!-- Theme style -->
        <link rel="stylesheet" href="{% static 'css/adminlte.min.css' %}">
    </head>
    <body class="hold-transition login-page">
        <div class="register-box">
            <div class="card card-outline card-primary">

                <div class="card-body">
                    <p class="login-box-msg">REGISTRAR CUENTA</p>
                    <img src="{% static 'img/divider.png' %} " height="25">
                    <form method="POST" class="col-12 mt-3">{% csrf_token %}
                        <div class="input-group mb-3">
                            <span style="color:red; font-weight: bolder; margin-left: -13px; margin-right: 5px;">*</span>{{ form.username }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-user"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            {{ form.nombres }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-user"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            {{ form.apellidos }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-user"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            <span style="color:red; font-weight: bolder; margin-left: -13px; margin-right: 5px;">*</span>{{ form.email }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-envelope-square"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            {{ form.role }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-envelope-square"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            <span style="color:red; font-weight: bolder; margin-left: -13px; margin-right: 5px;">*</span>{{ form.password1 }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-lock"></i></div></div>
                        </div>
                        <div class="input-group mb-3">
                            <span style="color:red; font-weight: bolder; margin-left: -13px; margin-right: 5px;">*</span>{{ form.password2 }}
                            <div class="input-group-append"><div class="input-group-text"><i class="fas fa-lock"></i></div></div>
                        </div>
                        <div class="row" style="color: #888;font-size: small;">
                            Los campos con <span style="color:red;font-weight: bolder;margin: 0px 5px 0px 5px;">*</span> son necesarios 
                        </div>
                        <div class="row">
                            <div class="col-4 offset-8">
                                <button type="submit" class="btn btn-primary btn-block mt-3 mb-3">Registrar</button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center"><a href="/">Ya tengo una cuenta</a></div>
                </div>
            </div>
        </div>
    </body>
</html>
